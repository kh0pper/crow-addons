services:
  llamacpp-vulkan-qwen38-27b-copilot:
    # COPILOT instance of Qwen3.8-27B. Co-resides with the 35b (group "standard",
    # evicts heavy+solo) so the critic refute-pass / recall probe / diverse critique
    # don't pay a 35b eviction + reload per run. 65536 ctx keeps the KV small.
    # TEXT-ONLY on purpose: refuters review diffs.
    #
    # ENGINE: gufo (since 2026-10-02; was llama.cpp rocm-7.2.3 draft-mtp n4, q8_0 KV).
    # The container name keeps its old "llamacpp-vulkan" prefix so every consumer
    # (pi localModels, dsv4-window.sh KNOWN_MODEL_CONTAINERS, zoo-q38-27b-arm.sh,
    # crow gateway provider crow-local-27b-copilot) keeps working unchanged.
    # Measured on crow 2026-10-01, same Q6 file, gufo + DFlash2 vs llama.cpp:
    # prefill 547/427/253 vs 265/179/85 t/s at depth 0/32k/131k, decode
    # 15.4/12.7/8.5 vs 12.4/11.6/5.5 t/s, zoo 9/9 with 0 false positives.
    # gufo sampling defaults for this model already equal the old llama.cpp flags
    # (temp 1.0, top_p 0.95, top_k 20, min_p 0,
    # presence 0; repeat penalty 1.0 = off in both, checked against the rocm-7.2.3 llama-server help); client params override.
    #
    # The binary is a host build mounted from ~/gufo-prod/current (the same build
    # family raven prod runs); the nix image supplies its ROCm/runtime closure via
    # the gufo-nix volume. Upgrade = repoint ~/gufo-prod/current + recreate.
    # Rollback = git checkout of this file's llama.cpp version + recreate.
    # Coupling: the solo and copilot slots share ~/gufo-prod/current and the gufo-nix
    # volume, so a bad repoint or a pruned volume takes BOTH down; smoke a new build
    # on one slot before restarting the other.
    image: docker.io/nixos/nix:latest
    container_name: llamacpp-vulkan-qwen38-27b-copilot
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    ulimits:
      memlock: -1
    volumes:
      - gufo-nix:/nix
      - ${HOME}/gufo-prod:/opt/gufo:ro
      # Only the two files this instance needs: gufo auto-discovers an mmproj
      # beside the model, and this slot is text-only.
      - ${LLM_CACHE}/qwen38-27b/Qwen3.8-27B-UD-Q6_K_XL.gguf:/models/Qwen3.8-27B-UD-Q6_K_XL.gguf:ro
      - ${LLM_CACHE}/qwen38-27b/Qwen3.8-27B-DFlash2-Q4_K_M.gguf:/models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf:ro
    ports:
      - "${CROW_TAILSCALE_IP}:8010:8000"
    command:
      - /opt/gufo/current/gufo
      - serve
      - llm
      - --model
      - /models/Qwen3.8-27B-UD-Q6_K_XL.gguf
      - --speculative
      - dflash2
      - --dflash-model
      - /models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      - --context
      - "65536"
      # One GPU session, like the old -np 1; concurrent critic units queue.
      - --sessions
      - "1"
      - --served-model-name
      - qwen3.8-27b
      # Critic fan-out sends up to 4 concurrent units from one client IP.
      - --max-pending-per-client
      - "16"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    stop_grace_period: 120s
    restart: "no"
    ipc: host
    shm_size: 16g

volumes:
  gufo-nix:
    external: true
