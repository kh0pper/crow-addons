services:
  llamacpp-vulkan-qwen36-27b:
    image: kyuz0/amd-strix-halo-toolboxes:rocm-7.2.1
    container_name: llamacpp-vulkan-qwen36-27b
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${LLM_CACHE}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8006:8000"
    entrypoint: ["llama-server"]
    command:
      # Qwen3.6-27B dense, UD-Q6_K_XL (~24 GB) + vision (mmproj-F16, added
      # 2026-07-02). Solo runner: starting it evicts the other local models,
      # which is what allows the full native 262144 context (KV = 16 GB
      # measured; ~50 GB free when solo). One tap on the 35B restores bot
      # service afterward. Files from unsloth/Qwen3.6-27B-GGUF.
      - -m
      - /models/qwen36-27b/Qwen3.6-27B-UD-Q6_K_XL.gguf
      - --mmproj
      - /models/qwen36-27b/mmproj-F16.gguf
      - --alias
      - qwen3.6-27b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - -fa
      - "on"
      - --no-mmap
      - -c
      - "262144"
      - -np
      - "1"
      - --jinja
    restart: "no"
    ipc: host
    shm_size: 16g
