services:
  llamacpp-vulkan-qwen35-122b:
    image: kyuz0/amd-strix-halo-toolboxes:vulkan-radv-mtp
    container_name: llamacpp-vulkan-qwen35-122b
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${LLM_CACHE}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8004:8000"
    entrypoint: ["llama-server"]
    command:
      # Qwen3.5-122B-A10B MTP, UD-Q4_K_XL (~79 GB, 3 shards; llama.cpp loads
      # the rest from shard 1). Downloaded 2026-07-01 from:
      #   https://huggingface.co/unsloth/Qwen3.5-122B-A10B-MTP-GGUF
      # ON-DEMAND: needs ~79 GB + KV. Don't run at full context alongside the
      # 35B server on 128 GB — stop one or lower -c.
      - -m
      - /models/qwen35-122b-a10b-mtp/Qwen3.5-122B-A10B-UD-Q4_K_XL-00001-of-00003.gguf
      - --mmproj
      - /models/qwen35-122b-a10b-mtp/mmproj-F16.gguf
      - --alias
      - qwen3.5-122b-a10b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - -fa
      - "on"
      - --no-mmap
      - -c
      - "131072"
      - -np
      - "1"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --jinja
    restart: "no"
    ipc: host
    shm_size: 16g
