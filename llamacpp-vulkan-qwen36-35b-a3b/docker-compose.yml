services:
  llamacpp-vulkan-qwen36-35b-a3b:
    # 2026-07-08: image corrected rocm-7.2.1 → vulkan-radv-mtp after the
    # h2-35b-overnight incident. The rocm-7.2.1 llama-server predates
    # draft-mtp (rejects --spec-type draft-mtp) and cannot load this gguf
    # (missing tensor blk.40.ssm_conv1d.weight) — the image line here was
    # stale; the long-running prod container was built from vulkan-radv-mtp.
    # Verified live on restore: draft-mtp initializes, acceptance 0.897.
    # Backend upgrades (newer llama.cpp with MTP) go through a measured
    # window, not an in-place tag swap.
    image: kyuz0/amd-strix-halo-toolboxes:vulkan-radv-mtp
    container_name: llamacpp-vulkan-qwen36-35b-a3b
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${LLM_CACHE}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8003:8000"
    entrypoint: ["llama-server"]
    command:
      # 2026-07-01: synced with the RUNNING container config — the old
      # /models/qwen36-35b-a3b/ dir (non-MTP Q6_K) was deleted in the disk
      # cleanup; the MTP Q5_K_XL copy below is the live one.
      # Model files in /home/kh0pp/llm/hf-cache/qwen36-35b-a3b-mtp/ from:
      #   https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF
      - -m
      - /models/qwen36-35b-a3b-mtp/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
      - --mmproj
      - /models/qwen36-35b-a3b-mtp/mmproj-F16.gguf
      - --alias
      - qwen3.6-35b-a3b
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - -fa
      - "on"
      - --no-mmap
      - -c
      - "262144"
      - -np
      - "1"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --jinja
    # was "no" until 2026-08-03: the 08-03 reboot left this Exited(0) and bots
    # were dark ~8.5h. unless-stopped matches the other model containers and is
    # window-compatible (docker stop marks it manually-stopped).
    restart: unless-stopped
    ipc: host
    shm_size: 16g
