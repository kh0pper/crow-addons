services:
  llamacpp-vulkan-glm52-iq2:
    # GLM-5.2 744B MoE, Unsloth UD-IQ2_M (223G, 6 parts) — workstream K
    # "deliberation tier" reviewer, IQ2 variant. Track 2 A/B (2026-07-12,
    # pi-lab docs/research/data/k-colibri/notes.md "TRACK 2 A/B COMPLETE"):
    # decode 1.25 tok/s, prefill 3.67 tok/s, quality ~6.0/10 (Claude blind
    # graders), 2/4 schema-key wobble ("find" vs "findings") — duty use
    # needs a schema-normalize wrapper. IQ2-vs-IQ4 duty pick DEFERRED
    # (Kevin 2026-07-13): both variants stay wired until the K5 pilot.
    #
    # HEAVY class: serving this evicts ALL prod bots (35b/copilot/4b) —
    # bots go dark. NEVER start it outside a deadman-capped window
    # (pi-lab scripts/glm52-window.sh). group "heavy" in localModels makes
    # the 02:30 nightly audit defer via its busy-check.
    image: kyuz0/amd-strix-halo-toolboxes:vulkan-radv-mtp
    container_name: llamacpp-vulkan-glm52-iq2
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    env_file:
      - ${HOME}/.crow/env/rocm.env
    volumes:
      - ${GLM52_IQ2_DIR}:/models
    ports:
      - "${CROW_TAILSCALE_IP}:8012:8000"
    entrypoint: ["llama-server"]
    command:
      # Arch = glm-dsa (MLA + DeepSeek sparse attention). Runs on the crow
      # iGPU (RADV GFX1151) with -ngl 999 --cpu-moe: dense core -> iGPU,
      # 256 experts -> CPU-side NVMe mmap. mmap is REQUIRED (223G model,
      # 128G RAM) — never add --no-mmap here; that flag is for the small
      # fully-resident prod models only.
      # -c 262144 + q8 KV = Kevin's serve decision (256K KV ~11G q8).
      # CAVEAT: q8 KV on glm-dsa is UNTESTED on this image (A/B ran
      # -c 16384, default KV). First smoke inside a window; if the KV
      # quant is rejected for MLA, fall back to f16 KV (~22G) or a
      # smaller -c and record it in k-colibri/notes.md.
      # Sampler defaults = GLM-5.2 model-card recommendation (temp 1.0,
      # top_p 0.95, top_k off) — greedy is WRONG for this model (A/B
      # datum). Requests may still override per-call.
      # --no-warmup: skip the warmup pass (a full expert sweep over a
      # 223G mmap would stall startup; A/B loaded in 161s without it).
      - -m
      - /models/UD-IQ2_M/GLM-5.2-UD-IQ2_M-00001-of-00006.gguf
      - --alias
      - glm-5.2
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - -ngl
      - "999"
      - --cpu-moe
      - -fa
      - "on"
      - -c
      - "262144"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - -np
      - "1"
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      - --top-k
      - "0"
      - --min-p
      - "0"
      - --jinja
      - --no-warmup
    restart: "no"
    ipc: host
    shm_size: 16g
